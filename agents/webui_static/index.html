<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>政策会诊 · 控制台</title>
<style>
  :root{
    --blue:#1e5bb8; --blue-deep:#123c78; --ink:#1c2733; --muted:#6b7a89;
    --bg:#f3f6fa; --card:#ffffff; --line:#e3e9f0;
    --ok:#12915f; --warn:#c07a12; --err:#c0392b; --run:#1e5bb8;
    --r-statute:#0e7f8f; --r-advisor:#2f8f4e; --r-challenger:#c2610e;
    --r-arbiter:#6f4fc0; --r-persona:#c04f7e; --r-researcher:#5a6b7d; --r-host:#1e5bb8;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);
       background:linear-gradient(180deg,#eaf1f9 0%,var(--bg) 240px);min-height:100vh}
  header{background:linear-gradient(120deg,var(--blue-deep),var(--blue));color:#fff;padding:18px 28px;
         display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  .brand{display:flex;align-items:baseline;gap:14px}
  .brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:2px}
  .brand span{font-size:12.5px;opacity:.85}
  .health{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);
          border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:6px 14px;font-size:13px;cursor:default}
  .dot{width:9px;height:9px;border-radius:50%;background:#ffb020;box-shadow:0 0 6px #ffb020}
  .dot.all{background:#3ddc97;box-shadow:0 0 6px #3ddc97}
  main{max-width:1180px;margin:26px auto 60px;padding:0 20px;display:grid;
       grid-template-columns:minmax(0,1fr) 320px;gap:20px}
  @media(max-width:960px){main{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        box-shadow:0 2px 10px rgba(23,43,77,.05);padding:20px 22px;margin-bottom:20px}
  .card h2{margin:0 0 14px;font-size:16px;display:flex;align-items:center;gap:9px}
  .card h2 .tag{font-size:11px;color:var(--muted);font-weight:400}
  textarea{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;
           font:14px/1.7 inherit;resize:vertical;color:var(--ink)}
  textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,91,184,.12)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
  .chip{border:1px solid var(--line);background:#f7fafd;border-radius:16px;padding:5px 13px;
        font-size:12.5px;color:#3c4c5c;cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--blue);color:var(--blue);background:#eef4fc}
  .actions{display:flex;align-items:center;gap:14px;margin-top:14px}
  button.primary{background:linear-gradient(120deg,var(--blue-deep),var(--blue));color:#fff;border:none;
        border-radius:10px;padding:11px 30px;font-size:15px;font-weight:600;letter-spacing:4px;cursor:pointer;
        transition:.15s;box-shadow:0 3px 10px rgba(30,91,184,.28)}
  button.primary:hover:not(:disabled){transform:translateY(-1px)}
  button.primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  .hint{font-size:12.5px;color:var(--muted)}
  .warnbar{display:none;background:#fdf3e3;border:1px solid #efd9ad;color:#8a5b12;border-radius:10px;
           padding:10px 14px;font-size:13px;margin-bottom:16px}
  /* 进度 */
  .phases{display:grid;gap:10px}
  .phase{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:11px;
         padding:11px 14px;background:#fbfdff}
  .phase .no{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
        font-size:13px;font-weight:700;color:#9fb0c0;border:2px solid #d8e2ec;flex:none}
  .phase .label{font-size:13.5px;flex:1}
  .phase .st{font-size:12px;color:var(--muted)}
  .phase.active{border-color:var(--blue);background:#f0f6ff}
  .phase.active .no{color:#fff;background:var(--blue);border-color:var(--blue);animation:pulse 1.6s infinite}
  .phase.done .no{color:#fff;background:var(--ok);border-color:var(--ok)}
  .phase.error{border-color:var(--err);background:#fdf1ef}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(30,91,184,.35)}50%{box-shadow:0 0 0 7px rgba(30,91,184,0)}}
  .roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin-top:14px}
  .role{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12.5px;
        display:flex;align-items:center;gap:7px;background:#fff;color:var(--muted)}
  .role i{width:8px;height:8px;border-radius:50%;background:#c9d4de;flex:none}
  .role.running{color:var(--ink);border-color:var(--c,var(--blue))}
  .role.running i{background:var(--c,var(--blue));animation:pulse 1.4s infinite}
  .role.done{color:var(--ink)}
  .role.done i{background:var(--ok)}
  .role.error i{background:var(--err)}
  .role small{margin-left:auto;color:var(--muted);font-size:11px}
  .feed{margin-top:14px;max-height:150px;overflow:auto;background:#0f1c2b;color:#b9d0e8;border-radius:10px;
        padding:10px 14px;font:12px/1.75 Consolas,monospace}
  .feed .t{color:#5f7d9e}
  /* 意见书 */
  .letter{border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:12px;background:#fffdf8;
          padding:26px 30px;font-size:14.5px;line-height:1.95;white-space:pre-wrap;word-break:break-word}
  .letter h3{font-family:"Noto Serif SC","SimSun",serif}
  .meta{font-size:12px;color:var(--muted);margin-top:10px}
  details{border:1px solid var(--line);border-radius:10px;margin-top:12px;background:#fbfdff}
  details summary{cursor:pointer;padding:10px 14px;font-size:13.5px;font-weight:600;color:#33506e;user-select:none}
  details .body{padding:2px 16px 14px;font-size:13.5px;line-height:1.85;white-space:pre-wrap;word-break:break-word;
                border-top:1px dashed var(--line);padding-top:12px}
  /* 侧栏 */
  aside .card h2{font-size:15px}
  .legend{display:grid;gap:7px}
  .legend .role{grid-column:1/-1}
  .hist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .hist li{border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;transition:.15s}
  .hist li:hover{border-color:var(--blue);background:#f0f6ff}
  .hist .q{font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .hist .t{font-size:11.5px;color:var(--muted);margin-top:3px}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:14px 0}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #cfe0f5;border-top-color:var(--blue);
        border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:7px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .errbox{background:#fdf1ef;border:1px solid #f0c9c2;color:var(--err);border-radius:10px;
          padding:12px 15px;font-size:13.5px;line-height:1.7}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>政策会诊</h1><span>七智能体协同 · 三阶段会诊 · AIP 国家标准协议</span></div>
  <div class="health" id="health"><span class="dot" id="hdot"></span><span id="htext">检查在线状态…</span></div>
</header>

<div style="max-width:1180px;margin:-6px auto 0;padding:0 20px"><div class="warnbar" id="warnbar"></div></div>

<main>
  <section>
    <div class="card">
      <h2>发起会诊 <span class="tag">要素越全，结论越准：领域 + 适用对象 + 时间</span></h2>
      <textarea id="q" placeholder="例：我们是南京一家 58 人的软件公司（研发 31 人，近三年研发费 380~610 万，发明专利 2 项软著 14 项），想申报 2026 年第一批高新技术企业认定，条件是否满足？哪些有风险？"></textarea>
      <div class="chips">
        <span class="chip" data-q="我们是南京一家58人的软件公司，研发人员31人，近三年研发费用380万/520万/610万，高新收入约4400万占92%，发明专利2项（自主研发有效）+软著14项，2023年3月注册的居民企业。想申报2026年江苏省高新技术企业认定（往年第一批约3-4月网报）。请依据国科发火〔2016〕32号逐条比对八项认定条件，每条注明原文出处，并指出短板与下一步清单。">高新技术企业认定（原文明确型）</span>
        <span class="chip" data-q="我们是南京市属普通本科高校（科研人员约120人，近三年纵向经费约8000万，已有1个省级工程研究中心），想申报2027年南京市市级重点实验室（方向：AI与智能制造交叉），申报条件是什么？若制度类别不存在请指出真实存在的平行制度及其文号。">市级重点实验室（待核实型）</span>
      </div>
      <div class="actions">
        <button class="primary" id="go">开始会诊</button>
        <span class="hint" id="hint">由本地七个智能体真实协作完成，全程约 2~4 分钟</span>
      </div>
    </div>

    <div class="card" id="progressCard" style="display:none">
      <h2><span class="spin" id="pspin"></span><span id="ptitle">会诊进行中</span></h2>
      <div class="phases" id="phases"></div>
      <div class="roles" id="roles"></div>
      <div class="feed" id="feed"></div>
    </div>

    <div class="card" id="resultCard" style="display:none">
      <h2>会诊意见书 <span class="tag" id="rmeta"></span></h2>
      <div id="errbox" class="errbox" style="display:none"></div>
      <div id="letter" class="letter"></div>
      <div id="collapses"></div>
    </div>
  </section>

  <aside>
    <div class="card">
      <h2>会诊团队 <span class="tag">7 位</span></h2>
      <div class="legend roles" id="team"></div>
    </div>
    <div class="card">
      <h2>历史会诊</h2>
      <ul class="hist" id="hist"></ul>
      <div class="empty" id="histEmpty">暂无记录</div>
    </div>
  </aside>
</main>

<script>
const $ = id => document.getElementById(id);
const ROLE_COLORS = {host:"var(--r-host)",statute:"var(--r-statute)",advisor:"var(--r-advisor)",
  challenger:"var(--r-challenger)",arbiter:"var(--r-arbiter)",persona:"var(--r-persona)",researcher:"var(--r-researcher)"};
const PHASES = [
  ["phase1","1","阶段一 · 三位专家并行独立作答"],
  ["phase2","2","阶段二 · 交叉质询与用户视角追问"],
  ["phase3","3","阶段三 · 仲裁官汇总裁决"],
];
let pollTimer=null, lastLen=0;

const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function mdLite(t){
  t = esc(t);
  t = t.replace(/^#{1,4}\s*(.+)$/gm, m=>"<h3>"+m.replace(/^#+\s*/,"")+"</h3>");
  t = t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  t = t.replace(/^[-—─*]{3,}$/gm,"<hr>");
  t = t.replace(/(【[^】]{2,20}】)/g,"<b style='color:#1e5bb8'>$1</b>");
  return t;
}

/* ---- 在线状态 ---- */
async function health(){
  try{
    const r = await (await fetch("/api/health")).json();
    const up = Object.values(r.roles).filter(x=>x.up).length;
    $("htext").textContent = `七人团在线 ${up}/7`;
    $("hdot").className = "dot" + (up===7?" all":"");
    const wb = $("warnbar");
    if(up<7){ wb.style.display="block";
      wb.innerHTML = "⚠ 有智能体不在线（"+up+"/7）。会诊前请先启动：<code>./start_all.sh</code>（缺的是 "+
        Object.entries(r.roles).filter(([k,v])=>!v.up).map(([k,v])=>v.name).join("、")+"）";
    } else wb.style.display="none";
    renderTeam(r.roles);
  }catch(e){ $("htext").textContent="控制台后端未响应"; }
}
function renderTeam(roles){
  $("team").innerHTML = Object.entries(roles).map(([k,v])=>
    `<div class="role" style="--c:${ROLE_COLORS[k]}"><i style="background:${v.up?'var(--ok)':'#c9d4de'}"></i>${v.name}</div>`).join("");
}

/* ---- 发起 ---- */
$("go").onclick = async () => {
  const q = $("q").value.trim();
  if(!q){ $("q").focus(); return; }
  const r = await fetch("/api/consult",{method:"POST",headers:{"Content-Type":"application/json"},
                                        body:JSON.stringify({question:q})});
  const j = await r.json();
  if(!r.ok){ $("hint").textContent = j.error||"发起失败"; return; }
  $("go").disabled = true; $("hint").textContent = "会诊进行中…请保持本页打开";
  $("resultCard").style.display="none"; $("progressCard").style.display="block";
  $("phases").innerHTML=""; $("roles").innerHTML=""; $("feed").innerHTML=""; lastLen=0;
  PHASES.forEach(([id,no,label],i)=>renderPhase(i,"wait"));
  poll(j.id);
};
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ $("q").value=c.dataset.q; });

function renderPhase(i,state){
  const [id,no,label] = PHASES[i];
  let el = document.querySelector(`.phase[data-i="${i}"]`);
  if(!el){ el=document.createElement("div"); el.dataset.i=i;
    el.innerHTML=`<div class="no">${no}</div><div class="label">${label}</div><div class="st"></div>`;
    $("phases").appendChild(el); }
  el.className="phase "+state;
  el.querySelector(".st").textContent = state==="wait"?"等待":state==="active"?"进行中…":state==="done"?"完成":"";
}

function poll(id){
  clearInterval(pollTimer);
  pollTimer = setInterval(async ()=>{
    try{
      const s = await (await fetch("/api/consult/"+id)).json();
      const news = s.events.slice(lastLen); lastLen = s.events.length;
      news.forEach(ev=>applyEvent(ev));
      if(!s.running){ clearInterval(pollTimer); finish(s); }
    }catch(e){ /* 瞬时网络抖动继续轮询 */ }
  }, 2000);
}

function applyEvent(ev){
  const f = $("feed");
  const line = document.createElement("div");
  const t = new Date(ev.ts*1000).toLocaleTimeString("zh-CN",{hour12:false});
  if(ev.kind==="phase"){
    line.innerHTML = `<span class="t">[${t}]</span> ${esc(ev.label)}`;
    const idx = PHASES.findIndex(p=>p[0]===ev.phase);
    if(idx>=0){ PHASES.forEach((_,i)=>renderPhase(i, i<idx?"done":i===idx?"active":"wait")); }
    if(ev.phase==="done"){ PHASES.forEach((_,i)=>renderPhase(i,"done")); $("ptitle").textContent="会诊完成"; $("pspin").style.display="none"; }
    if(ev.phase==="error"){ const i=PHASES.findIndex(p=>p[0]===ev.phase); renderPhase(Math.max(idx,0),"error"); $("ptitle").textContent="会诊失败"; $("pspin").style.display="none"; }
  }else if(ev.kind==="delegate.start"){
    line.innerHTML = `<span class="t">[${t}]</span> → 委派 <b>${esc(ev.name)}</b>`;
    addRole(ev.role,"running",ev.name);
  }else if(ev.kind==="delegate.done"){
    line.innerHTML = `<span class="t">[${t}]</span> ✓ ${esc(ev.name)} 返回 ${ev.chars} 字（${ev.seconds}s）`;
    addRole(ev.role,"done",ev.name,ev.seconds+"s");
  }else if(ev.kind==="delegate.error"){
    line.innerHTML = `<span class="t">[${t}]</span> ✗ ${esc(ev.name)} ${esc(ev.error)}`;
    addRole(ev.role,"error",ev.name,"失败");
  }
  f.appendChild(line); f.scrollTop = f.scrollHeight;
}

function addRole(role,state,name,extra){
  let el = document.querySelector(`.role[data-role="${role}"]`);
  if(!el){ el=document.createElement("div"); el.dataset.role=role;
    el.innerHTML=`<i></i><span>${esc(name)}</span><small></small>`; $("roles").appendChild(el); }
  el.className="role "+state; el.style.setProperty("--c",ROLE_COLORS[role]||"var(--blue)");
  el.querySelector("small").textContent = extra||"";
}

function finish(s){
  $("go").disabled=false; $("hint").textContent="由本地七个智能体真实协作完成，全程约 2~4 分钟";
  $("resultCard").style.display="block";
  if(s.error){ $("errbox").style.display="block"; $("errbox").textContent="会诊失败："+s.error;
    $("letter").style.display="none"; $("collapses").innerHTML=""; $("rmeta").textContent=""; return; }
  $("errbox").style.display="none"; $("letter").style.display="block";
  renderResult(s.result, s.started_at);
  loadHistory();
}

function renderResult(res, started){
  $("rmeta").textContent = (res.meta&&res.meta.finished_at?res.meta.finished_at.replace("T"," "):"")+" 交付";
  $("letter").innerHTML = mdLite(res.phase3||"(仲裁官无返回)");
  const p1 = res.phase1||{}, names={statute:"条文核查官",advisor:"落地顾问",challenger:"风险审查官"};
  $("collapses").innerHTML =
    Object.entries(p1).map(([k,v])=>`<details><summary>阶段一 · ${names[k]||k} 的独立结论</summary><div class="body">${mdLite(v)}</div></details>`).join("") +
    `<details><summary>阶段二 · 风险审查官交叉质询单</summary><div class="body">${mdLite(res.phase2||"")}</div></details>` +
    `<details><summary>阶段二 · 用户代言人追问</summary><div class="body">${mdLite(res.phase2b||"")}</div></details>`;
  $("resultCard").scrollIntoView({behavior:"smooth"});
}

/* ---- 历史 ---- */
async function loadHistory(){
  try{
    const j = await (await fetch("/api/history")).json();
    $("histEmpty").style.display = j.items.length?"none":"block";
    $("hist").innerHTML = j.items.map(it=>
      `<li data-f="${esc(it.file)}"><div class="q">${esc(it.question)}</div><div class="t">${esc(it.time)} · ${esc(it.file.startsWith("webui_")?"本地控制台":"平台/联调")}</div></li>`).join("");
    document.querySelectorAll(".hist li").forEach(li=>li.onclick=async()=>{
      const r = await (await fetch("/api/consultation/"+li.dataset.f)).json();
      $("progressCard").style.display="none";
      $("resultCard").style.display="block"; $("errbox").style.display="none"; $("letter").style.display="block";
      renderResult(r, null);
    });
  }catch(e){}
}

health(); loadHistory(); setInterval(health, 30000);
</script>
</body>
</html>
